# The node positions are persisted editor coordinates. Users may add, remove,
# reconnect and drag steps without changing the contract format.
process_graph:
  schema_version: 1.0.0
  provenance: synthetic-papermaking-process-hypotheses
  nodes:
    - node_id: raw-wood
      kind: source
      name: Bois brut
      output_materials: [grumes]
      position: {x: 0, y: 300}
    - node_id: debarking
      kind: operation
      name: Écorçage en parallèle
      machine_ids: [debarker-01, debarker-02]
      input_materials: [grumes]
      output_materials: [bois_écorcé]
      position: {x: 220, y: 300}
    - node_id: chipping
      kind: operation
      name: Déchiquetage en parallèle
      machine_ids: [chipper-01, chipper-02]
      input_materials: [bois_écorcé]
      output_materials: [copeaux]
      position: {x: 440, y: 300}
    - node_id: chips-buffer
      kind: buffer
      name: Silo à copeaux
      capacity: 80
      capacity_unit: tonnes
      input_materials: [copeaux]
      output_materials: [copeaux]
      position: {x: 660, y: 300}
    - node_id: kraft-pulping
      kind: operation
      name: Cuisson kraft
      machine_ids: [digester-01]
      input_materials: [copeaux]
      output_materials: [pâte_kraft_brune]
      position: {x: 900, y: 180}
    - node_id: tmp-pulping
      kind: operation
      name: Pâte thermomécanique
      machine_ids: [tmp-refiner-01]
      input_materials: [copeaux]
      output_materials: [pâte_tmp]
      position: {x: 900, y: 420}
    - node_id: board-pulping
      kind: operation
      name: Cuisson pâte carton
      machine_ids: [digester-02]
      input_materials: [copeaux]
      output_materials: [pâte_carton]
      position: {x: 900, y: 600}
    - node_id: pulp-washing
      kind: operation
      name: Lavage de la pâte
      machine_ids: [washer-01]
      input_materials: [pâte_kraft_brune, pâte_tmp, pâte_carton]
      output_materials: [pâte_lavée]
      position: {x: 1140, y: 300}
    - node_id: screening
      kind: operation
      name: Épuration et tamisage
      machine_ids: [screen-01]
      input_materials: [pâte_lavée]
      output_materials: [pâte_épurée]
      position: {x: 1360, y: 300}
    - node_id: bleaching
      kind: operation
      name: Blanchiment en parallèle
      machine_ids: [bleach-01, bleach-02]
      input_materials: [pâte_épurée]
      output_materials: [pâte_blanche]
      position: {x: 1580, y: 300}
    - node_id: stock-preparation
      kind: operation
      name: Préparation et mélange de pâte
      machine_ids: [stock-prep-01]
      input_materials: [pâte_blanche, additifs]
      output_materials: [suspension_papetière]
      position: {x: 1800, y: 300}
    - node_id: refining
      kind: operation
      name: Raffinage final
      machine_ids: [pulp-refiner-01]
      input_materials: [suspension_papetière]
      output_materials: [pâte_raffinée]
      position: {x: 2020, y: 300}
    - node_id: forming
      kind: operation
      name: Formation de la feuille
      machine_ids: [former-01]
      input_materials: [pâte_raffinée]
      output_materials: [feuille_humide]
      position: {x: 2240, y: 300}
    - node_id: pressing
      kind: operation
      name: Pressage
      machine_ids: [press-01]
      input_materials: [feuille_humide]
      output_materials: [feuille_pressée]
      position: {x: 2460, y: 300}
    - node_id: drying
      kind: operation
      name: Séchage en parallèle
      machine_ids: [dryer-01, dryer-02]
      input_materials: [feuille_pressée]
      output_materials: [papier_sec]
      position: {x: 2680, y: 300}
    - node_id: calendering
      kind: operation
      name: Calandrage
      machine_ids: [calender-01]
      input_materials: [papier_sec]
      output_materials: [papier_fini]
      position: {x: 2900, y: 300}
    - node_id: winding
      kind: operation
      name: Bobinage en parallèle
      machine_ids: [winder-01, winder-02]
      input_materials: [papier_fini]
      output_materials: [rouleaux_non_contrôlés]
      position: {x: 3120, y: 300}
    - node_id: quality-control
      kind: quality_control
      name: Contrôle qualité
      machine_ids: [qc-01]
      input_materials: [rouleaux_non_contrôlés]
      output_materials: [rouleaux_conformes, rouleaux_non_conformes]
      position: {x: 3340, y: 300}
    - node_id: paper-rolls
      kind: sink
      name: Rouleaux de papier
      input_materials: [rouleaux_conformes]
      position: {x: 3560, y: 300}
    - node_id: measured-losses
      kind: sink
      name: Pertes qualité mesurées
      input_materials: [rouleaux_non_conformes]
      position: {x: 3560, y: 500}
      metadata: {kpi: quality_loss_rate, measurement_unit: roll}
  edges:
    - {source: raw-wood, target: debarking, material: grumes}
    - {source: debarking, target: chipping, material: bois_écorcé}
    - {source: chipping, target: chips-buffer, material: copeaux}
    - {source: chips-buffer, target: kraft-pulping, condition: papier_kraft, material: copeaux}
    - {source: chips-buffer, target: tmp-pulping, condition: papier_impression, material: copeaux}
    - {source: chips-buffer, target: board-pulping, condition: carton, material: copeaux}
    - {source: kraft-pulping, target: pulp-washing, material: pâte_kraft_brune}
    - {source: tmp-pulping, target: pulp-washing, material: pâte_tmp}
    - {source: board-pulping, target: pulp-washing, material: pâte_carton}
    - {source: pulp-washing, target: screening, material: pâte_lavée}
    - {source: screening, target: bleaching, condition: qualité_blanche, material: pâte_épurée}
    - {source: screening, target: stock-preparation, condition: qualité_non_blanche, material: pâte_épurée}
    - {source: bleaching, target: stock-preparation, material: pâte_blanche}
    - {source: stock-preparation, target: refining, material: suspension_papetière}
    - {source: refining, target: forming, material: pâte_raffinée}
    - {source: forming, target: pressing, material: feuille_humide}
    - {source: pressing, target: drying, material: feuille_pressée}
    - {source: drying, target: calendering, material: papier_sec}
    - {source: calendering, target: winding, material: papier_fini}
    - {source: winding, target: quality-control, material: rouleaux_non_contrôlés}
    - {source: quality-control, target: paper-rolls, condition: conforme, probability: 0.92, material: rouleaux_conformes}
    - {source: quality-control, target: measured-losses, condition: non_conforme, probability: 0.08, material: rouleaux_non_conformes}

