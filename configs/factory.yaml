process_graph:
  schema_version: 1.0.0
  provenance: synthetic-process-engineering
  nodes:
    - {node_id: source, kind: source, name: Raw material store}
    - {node_id: preparation, kind: operation, name: Kit preparation, machine_ids: [prep-01]}
    - {node_id: cutting, kind: operation, name: Fabric cutting, machine_ids: [cutter-01]}
    - {node_id: layup, kind: operation, name: Parallel lay-up, machine_ids: [layup-01, layup-02]}
    - {node_id: intermediate-buffer, kind: buffer, name: Limited intermediate storage, capacity: 3, capacity_unit: panels}
    - {node_id: autoclave, kind: operation, name: Autoclave curing, machine_ids: [autoclave-01]}
    - {node_id: finishing, kind: operation, name: Trimming and finishing, machine_ids: [finish-01]}
    - {node_id: qc, kind: quality_control, name: Quality control, machine_ids: [qc-01]}
    - {node_id: rework, kind: rework, name: Bounded rework, machine_ids: [finish-01]}
    - {node_id: sink, kind: sink, name: Finished-goods store}
  edges:
    - {source: source, target: preparation}
    - {source: preparation, target: cutting}
    - {source: cutting, target: layup}
    - {source: layup, target: intermediate-buffer}
    - {source: intermediate-buffer, target: autoclave}
    - {source: autoclave, target: finishing}
    - {source: finishing, target: qc}
    - {source: qc, target: sink, condition: pass, probability: 0.92}
    - {source: qc, target: rework, condition: fail, probability: 0.08}
    - {source: rework, target: finishing}

