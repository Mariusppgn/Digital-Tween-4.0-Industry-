[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "sylvapapers-digital-twin"
version = "0.5.0"
description = "A configurable paper-mill digital twin with visual process editing and Weibull reliability."
readme = "README.md"
requires-python = ">=3.12"
license = {file = "LICENSE"}
authors = [
  {name = "Marius PROT"},
]
keywords = [
  "digital-twin",
  "discrete-event-simulation",
  "papermaking",
  "paper-mill",
  "predictive-maintenance",
  "operations-research",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "matplotlib>=3.8,<4",
  "networkx>=3.2,<4",
  "numpy>=1.26,<3",
  "pydantic>=2.8,<3",
  "PyYAML>=6.0,<7",
  "simpy>=4.1,<5",
  "scikit-learn>=1.5,<2",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.11,<2",
  "pre-commit>=3.8,<5",
  "pytest>=8.3,<9",
  "pytest-cov>=5,<7",
  "reportlab>=4.2,<5",
  "ruff>=0.6,<1",
  "types-networkx>=3.2,<4",
  "types-PyYAML>=6.0,<7",
]

[project.scripts]
sylvapapers = "sylvapapers_digital_twin.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"sylvapapers_digital_twin.web" = ["*.html", "*.css", "*.js"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501", "RUF001"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["sylvapapers_contracts", "sylvapapers_digital_twin", "sylvapapers_maintenance"]
mypy_path = "src"
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["joblib", "sklearn.*"]
ignore_missing_imports = true
