[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "asteria-composites-lab"
version = "0.1.0"
description = "A modular, reproducible industrial digital-twin demonstrator for composite panel manufacturing."
readme = "README.md"
requires-python = ">=3.12"
license = {file = "LICENSE"}
authors = [
  {name = "Marius PROT"},
]
keywords = [
  "digital-twin",
  "discrete-event-simulation",
  "composites",
  "predictive-maintenance",
  "operations-research",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "matplotlib>=3.8,<4",
  "networkx>=3.2,<4",
  "pydantic>=2.8,<3",
  "PyYAML>=6.0,<7",
  "simpy>=4.1,<5",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.11,<2",
  "pre-commit>=3.8,<5",
  "pytest>=8.3,<9",
  "pytest-cov>=5,<7",
  "reportlab>=4.2,<5",
  "ruff>=0.6,<1",
  "types-PyYAML>=6.0,<7",
]

[project.scripts]
asteria = "asteria_digital_twin.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["asteria_contracts", "asteria_digital_twin"]
mypy_path = "src"
warn_unused_ignores = true
